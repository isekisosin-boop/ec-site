{% extends "base.html" %}

{% block title %}お問い合わせ | EC SITE{% endblock %}

{% block description %}
EC SITEの商品やご注文についてのお問い合わせを承ります。
{% endblock %}

{% block content %}

<section class="page-header">
    <div class="page-header__inner">

        <p class="page-header__eyebrow">
            CONTACT
        </p>

        <h1 class="page-header__title">
            お問い合わせ
        </h1>

        <p class="page-header__text">
            商品やご注文についてのお問い合わせはこちらから。
        </p>

    </div>
</section>


<section class="contact-section">
    <div class="contact-section__inner">

        <form
            action="/contact"
            method="post"
            class="contact-form">

            <div class="contact-form__section">

                <p class="contact-form__eyebrow">
                    CONTACT FORM
                </p>

                <h2 class="contact-form__title">
                    お問い合わせ内容
                </h2>


                <div class="contact-form__field">

                    <label for="name">
                        お名前
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="お名前を入力してください"
                        autocomplete="name"
                        required>

                </div>


                <div class="contact-form__field">

                    <label for="email">
                        メールアドレス
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@example.com"
                        autocomplete="email"
                        required>

                </div>


                <div class="contact-form__field">

                    <label for="phone">
                        電話番号
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="000-0000-0000"
                        autocomplete="tel">

                </div>


                <div class="contact-form__field">

                    <label for="category">
                        お問い合わせ項目
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>

                        <option value="">
                            選択してください
                        </option>

                        <option value="product">
                            商品について
                        </option>

                        <option value="order">
                            ご注文について
                        </option>

                        <option value="delivery">
                            配送について
                        </option>

                        <option value="other">
                            その他
                        </option>

                    </select>

                </div>


                <div class="contact-form__field">

                    <label for="message">
                        お問い合わせ内容
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="8"
                        placeholder="お問い合わせ内容を入力してください"
                        required></textarea>

                </div>

            </div>


            <div class="contact-form__actions">

                <button
                    type="submit"
                    class="contact-form__submit">
                    送信する
                </button>

            </div>

        </form>

    </div>
</section>

{% endblock %}
